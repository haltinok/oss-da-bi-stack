spec: 1
id: sales-overview
title: Sales overview
description: Revenue, margin and orders by channel, product and territory.
locale: en-US
currency: USD
roles: [admin, manager]
time:
  dimension: dates.full_date
  fiscal_year_start: 7
filters:
  - id: fy
    dimension: dates.fiscal_year
    label: Fiscal year
  - id: region
    dimension: territories.region
    label: Region
    parent: territories.group_name
  - id: category
    dimension: products.category
    label: Category
  - id: subcategory
    dimension: products.subcategory
    label: Subcategory
    parent: products.category
panels:
  - id: kpis
    type: kpi
    measures:
      - { sum: [internet_sales.revenue, reseller_sales.revenue], label: Revenue, format: money }
      - { sum: [internet_sales.gross_profit, reseller_sales.gross_profit], label: Gross profit, format: money }
      - { ratio: { num: [internet_sales.gross_profit, reseller_sales.gross_profit], den: [internet_sales.revenue, reseller_sales.revenue] }, label: Gross margin, format: pct }
      - { sum: [internet_sales.orders, reseller_sales.orders], label: Orders, format: int }
      - { ratio: { num: [internet_sales.revenue, reseller_sales.revenue], den: [internet_sales.orders, reseller_sales.orders] }, label: Avg order value, format: money }
      - { sum: [internet_sales.units, reseller_sales.units], label: Units sold, format: int }
    sparkline: { granularity: month }
  - id: trend
    type: timeseries
    title: Monthly revenue by channel
    series:
      - { member: internet_sales.revenue, label: Internet, color: internet, format: money }
      - { member: reseller_sales.revenue, label: Reseller, color: reseller, format: money }
    granularity: month
    granularities: [month, quarter, year]
    style: stacked-bar
    on_click: { set_filter: fy }
  - id: margin
    type: timeseries
    title: Gross margin %
    series:
      - { ratio: { num: [internet_sales.gross_profit, reseller_sales.gross_profit], den: [internet_sales.revenue, reseller_sales.revenue] }, label: Gross margin, color: "#6250d6", format: pct }
    granularity: month
    style: line
  - id: mix
    type: treemap
    title: Product mix
    measure: internet_sales.revenue
    group: [products.category, products.subcategory]
    format: money
    on_click: { set_filter: [category, subcategory] }
  - id: top
    type: bar
    title: Top 10 products
    stack:
      - { member: internet_sales.revenue, label: Internet, color: internet }
      - { member: reseller_sales.revenue, label: Reseller, color: reseller }
    by: products.name
    sort: desc
    limit: 10
    format: money
  - id: territories
    type: bar
    title: Revenue by territory
    stack:
      - { member: internet_sales.revenue, label: Internet, color: internet }
      - { member: reseller_sales.revenue, label: Reseller, color: reseller }
    by: territories.region
    sort: desc
    limit: 20
    format: money
    on_click: { set_filter: region }
  - id: lines
    type: table
    title: Latest orders
    columns:
      - { member: internet_sales.order_number, label: Order }
      - { member: internet_sales.order_date, label: Date }
      - { member: territories.country, label: Country }
      - { member: internet_sales.revenue, label: Revenue, format: money }
    order: { internet_sales.order_date: desc }
    limit: 50
layout:
  - [kpis: 12]
  - [trend: 8, lines: 4]
  - [mix: 7, top: 5]
  - [margin: 5, territories: 7]
