spec: 1
id: sales-drilldown
title: Sales drill-down
description: Revenue over time that drills from year to month to day, a donut by subcategory and columns by category. Every click filters the rest.
tags: [sales]
locale: en-US
currency: USD
time:
  dimension: dates.full_date
  fiscal_year_start: 7
filters:
  - id: category
    dimension: products.category
    label: Category
  - id: subcategory
    dimension: products.subcategory
    label: Subcategory
    parent: products.category
  - id: region
    dimension: territories.region
    label: Region
panels:
  - id: group
    type: slicer
    dimension: territories.group_name      # a slicer on a field: no filter to declare (it narrows this dashboard, and the rollups have the field)
    label: Sales group
    display: chips
  - id: kpis
    type: kpi
    compare: previous_period
    measures:
      - { sum: [internet_sales.revenue, reseller_sales.revenue], label: Revenue, format: money }
      - { sum: [internet_sales.orders, reseller_sales.orders], label: Orders, format: int }
      - { ratio: { num: [internet_sales.revenue, reseller_sales.revenue], den: [internet_sales.orders, reseller_sales.orders] }, label: Avg order value, format: money }
      - { sum: [internet_sales.units, reseller_sales.units], label: Units sold, format: int }
    sparkline: { granularity: month }
  - id: trend
    type: timeseries
    title: Revenue by channel
    series:
      - { member: internet_sales.revenue, label: Internet, color: series1, format: money }
      - { member: reseller_sales.revenue, label: Reseller, color: series2, format: money }
    granularity: year
    drill: [year, month, day]
    style: stacked-area
  - id: donut
    type: pie
    title: Revenue by subcategory
    sum: [internet_sales.revenue, reseller_sales.revenue]
    label: Revenue
    by: products.subcategory
    by_label: Subcategory
    limit: 8
    style: donut
    format: money
    on_click: { set_filter: subcategory }
  - id: categories
    type: bar
    title: Revenue by category
    orientation: vertical
    stack:
      - { member: internet_sales.revenue, label: Internet, color: series1 }
      - { member: reseller_sales.revenue, label: Reseller, color: series2 }
    by: products.category
    sort: desc
    limit: 6
    format: money
    on_click: { set_filter: category }
  - id: regions
    type: bar
    title: Revenue by region
    stack:
      - { member: internet_sales.revenue, label: Internet, color: series1 }
      - { member: reseller_sales.revenue, label: Reseller, color: series2 }
    by: territories.region
    sort: desc
    limit: 10
    format: money
    on_click: { set_filter: region }
  - id: detail
    type: table
    title: Revenue by subcategory
    columns:
      - { member: products.category, label: Category }
      - { member: products.subcategory, label: Subcategory }
      - { member: internet_sales.revenue, label: Internet revenue, format: money }
      - { member: reseller_sales.revenue, label: Reseller revenue, format: money }
      - { member: internet_sales.margin_pct, label: Internet margin, format: pct }
      - { member: reseller_sales.margin_pct, label: Reseller margin, format: pct }
    order: { internet_sales.revenue: desc }
    limit: 50
    totals: footer
layout:
  - [kpis: 12]
  - [group: 12]
  - [trend: 7, donut: 5]
  - [categories: 6, regions: 6]
  - [detail: 12]
