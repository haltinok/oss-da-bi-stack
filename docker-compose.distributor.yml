# The distributor example model (models/distributor/: a Turkish SME on Postgres) as the ONLY model of a stack: no StarRocks, Kafka, Airflow or dbt. (docker-compose.yml itself has
# the model's services under the profile `distributor`; together with `starrocks` it serves both models side by side, see PLAN-models.md.) This overlay is what is different when the
# distributor is the whole stack:
#   - MODELS=distributor (the pages, the builder, the lab and the admin console serve only it, and it is the default);
#   - the access database is seeded on its first start with the distributor's datasets and row-level dimension (access.sql, from rls_dimensions.json) instead of
#     AdventureWorks', and Cube reads the same dimensions from the model's file;
#   - the base file's fixed subnet (it pins StarRocks' node addresses) is dropped, so this can run next to a StarRocks stack.
#
#   docker compose -p distributor -f docker-compose.yml -f docker-compose.distributor.yml --profile distributor up -d --build \
#     postgres distributor-db cubestore cubestore-worker keycloak auth cube-distributor dashboard-cube builder lab admin
#
# (name the services: the base file's Airflow, Kafka and the rest have no profile and would start too.) Use its own project name (-p), stop the other stack first or move this
# one's ports (every published port is a variable in .env: POSTGRES_PORT, KEYCLOAK_PORT, AUTH_PORT, CUBE_DISTRIBUTOR_PORT, DASHBOARD_CUBE_PORT, ...). Sign in as admin
# (TEST_USER_PASSWORD from .env).

services:
  postgres:
    container_name: distributor_postgres
    environment:
      MODEL_ACCESS_SQL: /model/access.sql          # postgres/init/13_model_access.sh: the model's datasets, grants and row-level dimensions instead of AdventureWorks' (first start only)
    volumes:
      - ./models/distributor:/model:ro

  cube-distributor:
    volumes:
      - ./models/distributor/rls_dimensions.json:/cube/conf/rls_dimensions.json:ro   # its row-level dimensions (the access database is seeded with the same)

  admin:
    environment:
      MODELS: distributor

  lab:
    environment:
      MODELS: distributor

  builder:
    environment:
      MODELS: distributor

  dashboard-cube:
    environment:
      MODELS: distributor
    volumes: !override
      - ./dashboard/static:/usr/share/nginx/html:ro
      - ./dashboard/cube:/srv/cube:ro
      - ./models/distributor/dashboards/build:/srv/dashboards:ro                  # the default model's, at the old address
      - ./models/distributor/dashboards/build:/srv/models-dashboards/distributor:ro
      - ./dashboard/cube/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

networks:
  default:
    ipam: !reset null
