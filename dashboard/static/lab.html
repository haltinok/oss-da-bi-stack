<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SQL lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='12' rx='2' fill='none' stroke='%232a78d6' stroke-width='1.6'/%3E%3Cpath d='M4 6l2 2-2 2M8 11h4' fill='none' stroke='%232a78d6' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/render/render.css">
  <link rel="stylesheet" href="/render/lab.css">
</head>
<body>
<!-- Served for /lab/: the SQL lab (render/lab.js talks to the lab service, which runs each statement on Cube's SQL API as the signed-in person). -->
<div class="wrap lab-wrap" id="app">
  <nav class="home-nav" aria-label="Home"><a class="home-link" href="/home/">&larr; <span id="home-text">Home</span></a></nav>
  <header class="top">
    <div class="brand"><h1><span id="title">SQL lab</span></h1><span class="sub" id="brand-sub"></span></div>
    <div class="tools" id="tools">
      <label class="field" id="model-field" hidden><span id="model-label">Model</span> <select id="f-model" aria-label="Model"></select></label>
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language" title="Language"><button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button><button type="button" data-lang="tr" lang="tr" aria-label="Türkçe" aria-pressed="false">TR</button></div>
      <button class="icon-btn" id="theme" title="Theme" aria-label="Theme" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="error-banner" id="error" hidden></div>
  <main id="main"></main>
</div>
<script src="/cube/config.js"></script>
<script type="module" src="/render/lab.js"></script>
</body>
</html>
