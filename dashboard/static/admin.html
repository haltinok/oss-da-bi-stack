<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='5' r='3' fill='%232a78d6'/%3E%3Cpath d='M2 14c0-3 3-5 6-5s6 2 6 5z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/render/render.css">
  <link rel="stylesheet" href="/render/admin.css">
</head>
<body>
<!-- Served for /admin/: the console for people, groups and roles (render/admin.js talks to the admin service, which talks to Keycloak). Only an admin gets in. -->
<div class="wrap" id="app">
  <nav class="home-nav" aria-label="Dashboards"><a class="home-link" id="home-link" href="/d/" title="Dashboards">&larr; <span id="home-text">Dashboards</span></a></nav>
  <header class="top">
    <div class="brand"><h1><span id="title">Admin</span></h1><span class="sub" id="brand-sub"></span></div>
    <div class="tools" id="tools">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language" title="Language"><button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button><button type="button" data-lang="tr" lang="tr" aria-label="Türkçe" aria-pressed="false">TR</button></div>
      <button class="icon-btn" id="theme" title="Theme" aria-label="Theme" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="error-banner" id="error" hidden></div>
  <main id="main"></main>
</div>
<dialog id="dlg" class="adm-dialog"></dialog>
<script src="/cube/config.js"></script>
<script type="module" src="/render/admin.js"></script>
</body>
</html>
