# Serves the existing dashboard (dashboard/static, unchanged) and injects the spike's data
# source in front of app.js: sign-in + Cube adapter instead of the Postgres-backed /api/*.
server {
    listen 8250;
    root /usr/share/nginx/html;
    index index.html;

    location /spike/ {
        alias /srv/spike/;
        default_type text/javascript;   # .mjs is not in nginx's mime.types
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        sub_filter_once on;
        sub_filter '<script src="app.js"></script>'
                   '<script src="spike/config.js"></script><script src="spike/boot.js"></script><script type="module" src="spike/cube-source.mjs"></script><script src="app.js"></script>';
    }
}
