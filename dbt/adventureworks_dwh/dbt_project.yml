name: 'adventureworks_dwh'
version: '1.0.0'
config-version: 2

profile: 'adventureworks_dwh'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  adventureworks_dwh:
    staging:
      +schema: stage
      +materialized: view
    intermediate:
      +schema: stage
      +materialized: ephemeral
    marts:
      +schema: mart
      +materialized: table

vars:
  # Historical AdventureWorks dates end in mid-2014; the live simulator writes
  # current dates. Shifting history forward 12 years lands it in 2023-2026, so
  # the series runs into the live data without a gap (see
  # macros/shift_history_date.sql). Set to 0 for the original calendar.
  date_shift_years: 12
  # Dates before this are historical seed data and get shifted.
  date_shift_cutoff: '2015-01-01'
