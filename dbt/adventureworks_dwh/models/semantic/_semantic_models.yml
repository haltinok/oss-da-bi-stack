version: 2

# MetricFlow semantic layer over the mart star schema.
#
# The marts already are a star, so each semantic model is a thin declaration on
# top of one mart table: the facts carry the measures, the dimension tables
# carry the attributes you group by. MetricFlow joins them on shared `entities`
# -- a `foreign` entity on a fact resolves to the `primary` entity of the same
# name on a dimension, so `product` below is what lets you ask for internet
# revenue by `product__product_category_name` without writing the join.
#
# Measure names are global, not per-model, so the channel facts prefix theirs
# (`internet_*` / `reseller_*`). Cross-channel totals are derived metrics in
# _metrics.yml.

semantic_models:
  # ---------------------------------------------------------------- facts ----
  - name: internet_sales
    description: >
      Online (web) sales order lines, one row per order line. Measures are
      additive over every dimension here except the distinct counts.
    model: ref('fact_internet_sales')
    defaults:
      agg_time_dimension: order_date

    entities:
      # The mart grain is (sales_order_number, sales_order_line_number); neither
      # column is unique on its own, so the primary entity is the composite.
      - name: internet_sales_line
        type: primary
        expr: sales_order_number || '-' || sales_order_line_number::text
      - name: sales_order
        type: foreign
        expr: sales_order_number
      - name: product
        type: foreign
        expr: product_key
      - name: customer
        type: foreign
        expr: customer_key
      - name: promotion
        type: foreign
        expr: promotion_key
      - name: sales_territory
        type: foreign
        expr: sales_territory_key
      # Role-playing dates: MetricFlow resolves one entity name to one join, so
      # the order-date role gets its own entity (and its own semantic model on
      # dim_date below). Due/ship dates stay as plain time dimensions -- add
      # `due_calendar` / `ship_calendar` the same way if you need the fiscal
      # calendar on those roles too.
      - name: order_calendar
        type: foreign
        expr: order_date_key

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: due_date
        type: time
        type_params:
          time_granularity: day
      - name: ship_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
        description: AdventureWorks order status code (5 = shipped).
      - name: currency_key
        type: categorical
        description: ISO currency code the line was priced in.

    measures:
      - name: internet_sales_amount
        description: Net line revenue, after line discount, before tax and freight.
        agg: sum
        expr: sales_amount
      - name: internet_order_quantity
        description: Units sold.
        agg: sum
        expr: order_quantity
      - name: internet_product_cost
        description: Standard cost of the units sold.
        agg: sum
        expr: total_product_cost
      - name: internet_discount_amount
        agg: sum
        expr: discount_amount
      - name: internet_tax_amount
        agg: sum
        expr: tax_amt
      - name: internet_freight
        agg: sum
        expr: freight
      # Non-additive: counting lines would overcount orders, since an order
      # carries one row per line.
      - name: internet_order_count
        description: Distinct online orders.
        agg: count_distinct
        expr: sales_order_number
      - name: internet_customer_count
        description: Distinct customers who ordered.
        agg: count_distinct
        expr: customer_key
      - name: internet_line_count
        description: Order lines.
        agg: count
        expr: sales_order_line_number

  - name: reseller_sales
    description: >
      Reseller (distributor) sales order lines, one row per order line. Mirrors
      internet_sales, plus the reseller and salesperson entities.
    model: ref('fact_reseller_sales')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: reseller_sales_line
        type: primary
        expr: sales_order_number || '-' || sales_order_line_number::text
      - name: sales_order
        type: foreign
        expr: sales_order_number
      - name: product
        type: foreign
        expr: product_key
      - name: reseller
        type: foreign
        expr: reseller_key
      - name: employee
        type: foreign
        expr: employee_key
      - name: promotion
        type: foreign
        expr: promotion_key
      - name: sales_territory
        type: foreign
        expr: sales_territory_key
      - name: order_calendar
        type: foreign
        expr: order_date_key

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: due_date
        type: time
        type_params:
          time_granularity: day
      - name: ship_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
      - name: currency_key
        type: categorical

    measures:
      - name: reseller_sales_amount
        agg: sum
        expr: sales_amount
      - name: reseller_order_quantity
        agg: sum
        expr: order_quantity
      - name: reseller_product_cost
        agg: sum
        expr: total_product_cost
      - name: reseller_discount_amount
        agg: sum
        expr: discount_amount
      - name: reseller_order_count
        description: Distinct reseller orders.
        agg: count_distinct
        expr: sales_order_number
      - name: reseller_count
        description: Distinct resellers who ordered.
        agg: count_distinct
        expr: reseller_key
      - name: reseller_line_count
        agg: count
        expr: sales_order_line_number

  # ----------------------------------------------------------- dimensions ----
  # No measures here: these exist so the facts can be grouped by product,
  # customer, geography and so on.
  - name: product
    description: Products, with their subcategory/category rollup.
    model: ref('dim_product')
    entities:
      - name: product
        type: primary
        expr: product_key
    dimensions:
      - name: product_name
        type: categorical
      - name: product_category_name
        type: categorical
      - name: product_subcategory_name
        type: categorical
      - name: color
        type: categorical
      - name: product_line
        type: categorical
      - name: class
        type: categorical
      - name: style
        type: categorical
      - name: status
        type: categorical
        description: Current or Discontinued, derived from sell_end_date.
      - name: size_unit_measure_code
        type: categorical
      - name: weight_unit_measure_code
        type: categorical

  - name: customer
    description: Individual (person) customers. Resellers live in the reseller model.
    model: ref('dim_customer')
    entities:
      - name: customer
        type: primary
        expr: customer_key
    dimensions:
      - name: customer_name
        type: categorical
        expr: trim(coalesce(first_name, '') || ' ' || coalesce(last_name, ''))
      - name: email_address
        type: categorical

  # No semantic model on dim_geography on purpose. MetricFlow joins exactly one
  # hop out from the fact, and the sales facts carry customer_key, not
  # geography_key -- so city/country would only be reachable as a second hop
  # (fact -> customer -> geography) and would not resolve. Geography at
  # territory grain comes from sales_territory below, which the facts do key.
  # To get true city grain into the layer, denormalise geography_key onto the
  # facts (or onto a wide sales model) and give it its own semantic model.

  - name: sales_territory
    model: ref('dim_sales_territory')
    entities:
      - name: sales_territory
        type: primary
        expr: sales_territory_key
    dimensions:
      - name: sales_territory_region
        type: categorical
      - name: sales_territory_country
        type: categorical
      - name: sales_territory_group
        type: categorical

  - name: promotion
    model: ref('dim_promotion')
    entities:
      - name: promotion
        type: primary
        expr: promotion_key
    dimensions:
      - name: promotion_name
        type: categorical
      - name: promotion_type
        type: categorical
      - name: promotion_category
        type: categorical

  - name: reseller
    model: ref('dim_reseller')
    entities:
      - name: reseller
        type: primary
        expr: reseller_key
    dimensions:
      - name: reseller_name
        type: categorical

  - name: employee
    description: Salespeople, for reseller-channel attribution.
    model: ref('dim_employee')
    entities:
      - name: employee
        type: primary
        expr: employee_key
    dimensions:
      - name: employee_name
        type: categorical
        expr: trim(coalesce(first_name, '') || ' ' || coalesce(last_name, ''))
      - name: department_name
        type: categorical
      - name: sales_person_flag
        type: categorical

  - name: order_calendar
    description: >
      dim_date in its order-date role. MetricFlow gives calendar day/week/month/
      quarter/year for free off the fact's time dimension; this model is what
      adds the things a spine can't derive -- AdventureWorks' July-June fiscal
      year, and the named day/month labels.
    model: ref('dim_date')
    entities:
      - name: order_calendar
        type: primary
        expr: date_key
    dimensions:
      - name: order_day
        type: time
        expr: full_date
        type_params:
          time_granularity: day
      - name: fiscal_year
        type: categorical
      - name: fiscal_quarter
        type: categorical
      - name: calendar_year
        type: categorical
      - name: calendar_quarter
        type: categorical
      - name: calendar_semester
        type: categorical
      - name: month_name
        type: categorical
      - name: day_name
        type: categorical
      - name: week_of_year
        type: categorical
