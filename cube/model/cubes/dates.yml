cubes:
  - name: dates
    description: "The calendar: join target for a time axis and fiscal years."
    sql_table: mart.dim_date
    data_source: default

    dimensions:
      - name: key
        description: "Date key."
        sql: date_key
        type: number
        primary_key: true
      - name: full_date
        description: "Calendar date (a time dimension)."
        sql: full_date
        type: time
      - name: fiscal_year
        description: "Fiscal year, named after the year it ends in (the year starts in July: July 2020 is FY2021)."
        sql: fiscal_year
        type: number
      - name: calendar_year
        description: "Calendar year."
        sql: calendar_year
        type: number
      - name: month_of_year
        description: "Month number, 1 (January) to 12 (December)."
        sql: month_of_year
        type: number
      - name: month_name
        description: "Month name. Sorted by the month's number (January first), not alphabetically."
        sql: month_name
        type: string
        meta:
          sort_by: month_of_year        # a table, a pivot or a filter list that orders by this field asks for dates.month_of_year and orders by that
