cubes:
  - name: offer_performance
    description: "Special offers and what happened to unit sales during them versus the 28 days before. Descriptive only: no control group, so it also carries seasonality and trend. Marketing and admin."
    sql_table: mart.offer_performance
    data_source: default
    # Descriptive evidence only: units per day of the products sold under an offer, during it versus the
    # 28 days before. No control group, so it also carries seasonality and trend. Marketing and admin only.

    dimensions:
      - name: key
        description: "Offer key."
        sql: special_offer_id
        type: number
        primary_key: true
        public: true
      - name: description
        description: "Offer description."
        sql: description
        type: string
      - name: offer_type
        description: "Type of offer."
        sql: offer_type
        type: string
      - name: offer_category
        description: "Offer category."
        sql: offer_category
        type: string
      - name: discount_band
        description: "Discount depth band."
        sql: discount_band
        type: string
      - name: discount_pct
        description: "Discount in percent."
        sql: discount_pct
        type: number
      - name: start_date
        description: "Offer start (a time dimension)."
        sql: start_date
        type: time
      - name: end_date
        description: "Offer end (a time dimension)."
        sql: end_date
        type: time
      - name: lift
        description: "Units per day during the offer over units per day in the 28 days before."
        sql: lift
        type: number

    measures:
      - name: offers
        description: "Number of offers."
        type: count
      - name: units_during
        description: "Units sold during offers."
        sql: units_during
        type: sum
      - name: units_before
        description: "Units sold in the 28 days before offers."
        sql: units_before
        type: sum
      - name: days_during
        description: "Days offers ran."
        sql: days_during
        type: sum
      # Average of the per-offer lift (units/day during over units/day in the 28 days before). Offers with
      # no baseline have a null lift and are skipped by avg. One offer with a tiny baseline can dominate it.
      - name: avg_lift
        description: "Average of the per-offer lift (offers with no baseline are skipped; one offer with a tiny baseline can dominate it)."
        sql: lift
        type: avg
