# All secrets are required from .env -- there are deliberately no weak fallbacks.
# `scripts/generate-env.sh` writes a .env with strong random values.
x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # dbt and ingestr read their connections from the environment (see
    # dbt/adventureworks_starrocks/profiles.yml), so no credentials are stored in the repository.
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Simulator tuning: per-run chance of creating a new sales order. Empty by
    # default, which derives it from the seeded history's trailing window so the
    # live series continues the history instead of stepping off it (~0.017,
    # 4.8 orders/day). Set it in .env to pin a livelier rate: 0.05 is ~14/day.
    SIM_ORDER_CHANCE: ${SIM_ORDER_CHANCE:-}
    # Per-run chance an order advances toward shipped, or is rejected/cancelled.
    STATUS_ADVANCE_CHANCE: ${STATUS_ADVANCE_CHANCE:-0.25}
    STATUS_CANCEL_CHANCE: ${STATUS_CANCEL_CHANCE:-0.05}
    # `postgres_active_to_starrocks` DAG: dbt-starrocks and ingestr connect to the StarRocks frontend.
    # (Both read POSTGRES_PASSWORD above for the postgres_active source; StarRocks root has no password
    # on the internal network -- the demo posture, see SECURITY.md.)
    DBT_SR_HOST: starrocks-fe
    DBT_SR_PORT: "9030"
    STARROCKS_HOST: starrocks-fe
    STARROCKS_PORT: "9030"
    # `inventory_weekly_proposals` DAG (the proposal agent): its Keycloak service account and where it reaches
    # Cube, the auth service and the actions service. ANTHROPIC_API_KEY is optional: without it the agent drafts
    # with plain rules instead of a model.
    AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    AGENT_LOG_DIR: /opt/airflow/logs/agent
    KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/spike/protocol/openid-connect/token
    AUTH_URL: http://auth:8200
    CUBE_URL: http://cube:4000/cubejs-api/v1/load
    ACTIONS_URL: http://actions:8300
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    # Airflow 3 defaults to the Simple Auth Manager; switching to FAB keeps
    # the familiar env-var-provisioned admin user/password workflow.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH__JWT_SECRET:?set AIRFLOW_API_AUTH__JWT_SECRET in .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH__JWT_ISSUER:-airflow}
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/scripts:/opt/airflow/scripts
    - ./agent:/opt/airflow/agent:ro
    - ./dlt:/opt/airflow/dlt
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

# Every published port is overridable from .env so this stack can run next to
# another one on the same host (the defaults below are the historical values).
services:
  postgres:
    image: postgres:16
    container_name: oss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_active:
    image: postgres:16
    container_name: postgres_active
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: active_db
      # Used by init/00_debezium_user.sh to create the replication user.
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?set DEBEZIUM_PASSWORD in .env}
      # Used by init/05_actions_user.sh to create the inventory actions service's writer login (skipped when empty).
      ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_ACTIVE_PORT:-5434}:5434"
    command:
      - "postgres"
      - "-p"
      - "5434"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_wal_size=4GB"
      # Cap the WAL a replication slot may pin. Without it, an inactive Debezium
      # slot (cdc profile off, Connect down) retains WAL forever while the
      # simulators keep writing, until the volume fills. A slot that falls
      # further behind is invalidated; Debezium then needs a re-snapshot.
      - "-c"
      - "max_slot_wal_keep_size=2GB"
    volumes:
      - postgres_active_data:/var/lib/postgresql/data
      - ./postgres_active/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5434"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-perm-fix:
    <<: *airflow-common
    container_name: oss_airflow_perm_fix
    restart: "no"
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/plugins
        mkdir -p /opt/airflow/dbt/adventureworks_starrocks/target /opt/airflow/dbt/adventureworks_starrocks/logs
        chown -R 50000:0 /opt/airflow/dbt/adventureworks_starrocks/target /opt/airflow/dbt/adventureworks_starrocks/logs

  airflow-init:
    <<: *airflow-common
    container_name: oss_airflow_init
    restart: "no"
    entrypoint: /bin/bash
    depends_on:
      postgres:
        condition: service_healthy
      airflow-perm-fix:
        condition: service_completed_successfully
    command:
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        # Create the admin on the first run. In Airflow 3.x `users create` exits
        # 0 even when the user already exists (it only logs) and never updates
        # an existing user, so always re-sync the password to
        # AIRFLOW_ADMIN_PASSWORD from .env afterwards.
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
        airflow users reset-password \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}"

  airflow-api-server:
    <<: *airflow-common
    container_name: oss_airflow_api_server
    restart: unless-stopped
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: oss_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: oss_airflow_dag_processor
    restart: unless-stopped
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: oss_airflow_triggerer
    restart: unless-stopped
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    profiles: [cdc]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Kafka's own CLI: `cub` (Confluent's Python helper) is gone from the
      # 8.3+ images, so it can't be used for the health check any more.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-connect:
    build:
      context: ./debezium-connect
    # Explicit tag, shared with debezium-register below, so the image is built
    # once whatever the project (folder) name is.
    image: oss-da-bi-stack-kafka-connect
    container_name: kafka_connect
    profiles: [cdc]
    restart: unless-stopped
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_HEAP: -Xmx1g
      # Resolve `${env:VAR}` in connector configs at runtime, so the Debezium
      # password is never stored in the _connect_configs topic or returned by
      # GET /connectors/<name>/config. The allowlist limits which variables a
      # connector config can read.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^DEBEZIUM_PASSWORD$$
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?set DEBEZIUM_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # Plain bash HTTP check (GET /connectors must answer 200): newer
      # Confluent images don't ship curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /connectors HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Creates or updates the Debezium connector once Connect's REST API is up, so
  # registering it is no longer a manual setup step. Uses the Debezium/Connect
  # image (which ships python3) and PUT, which is idempotent -- re-running
  # compose updates the connector in place instead of triggering another
  # initial snapshot.
  debezium-register:
    build:
      context: ./debezium-connect
    # Same artifact as kafka-connect (the register script needs only python3):
    # sharing the explicit tag means the confluent-hub plugin downloads once
    # per build instead of twice, and the CI cdc-smoke job pre-builds it with
    # one command.
    image: oss-da-bi-stack-kafka-connect
    container_name: oss_debezium_register
    profiles: [cdc]
    restart: "no"
    entrypoint: ["python3", "/connectors/register_connector.py"]
    # No secrets here: the connector config holds `${env:DEBEZIUM_PASSWORD}`,
    # which kafka-connect itself resolves (see CONNECT_CONFIG_PROVIDERS).
    volumes:
      - ./debezium-connect:/connectors:ro
    depends_on:
      postgres_active:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka_ui
    profiles: [cdc]
    restart: unless-stopped
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    profiles: [cdc]
    restart: unless-stopped
    environment:
      # The official image writes users.d/default-user.xml from these, so the
      # password lives in .env instead of a committed users.xml.
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      # Kafka client settings (fast discovery of the CDC topics); see the file.
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ulimits:
      nofile: 262144
    # No hard dependency on Kafka: ClickHouse starts fine without it (the
    # Kafka-engine cdc.* tables just retry until Kafka is up).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -qi ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------------
  # `starrocks` profile: the serving path that replaces analytics.mart.
  #   postgres_active --(ingestr, every 5 min via Airflow)--> StarRocks raw
  #   --(dbt-starrocks)--> mart --> Cube (+ Cube Store rollups, row-level security)
  #   --> dashboard behind Keycloak sign-in.
  # Needs the core stack (Airflow runs the pipeline; postgres_active is the source):
  #   docker compose --profile starrocks up -d --build
  # StarRocks runs as a separate frontend and backend. The all-in-one image advertises its
  # backend as 127.0.0.1, which no other container can reach, so Stream Load from the
  # Airflow container (ingestr) would fail; here the backend registers by hostname.
  # ------------------------------------------------------------------------
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3-latest
    profiles: [starrocks]
    restart: unless-stopped
    hostname: starrocks-fe
    # One backend: tables must not ask for the default 3 replicas.
    command:
      - bash
      - -c
      - echo 'default_replication_num = 1' >> /opt/starrocks/fe/conf/fe.conf && exec /opt/starrocks/fe/bin/start_fe.sh
    ports:
      - "127.0.0.1:${STARROCKS_MYSQL_PORT:-9030}:9030"
      - "127.0.0.1:${STARROCKS_HTTP_PORT:-8030}:8030"
    volumes:
      - starrocks_fe_meta:/opt/starrocks/fe/meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  starrocks-be:
    image: starrocks/be-ubuntu:3.3-latest
    profiles: [starrocks]
    restart: unless-stopped
    hostname: starrocks-be
    command: ["/opt/starrocks/be/bin/start_be.sh"]
    # The 500M-line spike needed 40 GB; the live demo data (~120k order lines) fits in a few.
    mem_limit: ${STARROCKS_MEM_LIMIT:-12g}
    volumes:
      - starrocks_be_storage:/opt/starrocks/be/storage
    depends_on:
      starrocks-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  starrocks-init:
    image: starrocks/fe-ubuntu:3.3-latest
    profiles: [starrocks]
    restart: "no"
    entrypoint: ["bash", "/init.sh"]
    environment:
      STARROCKS_FE: starrocks-fe
      CUBE_DB_PASSWORD: ${CUBE_DB_PASSWORD:?set CUBE_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      ACTIONS_SR_PASSWORD: ${ACTIONS_SR_PASSWORD:?set ACTIONS_SR_PASSWORD in .env}
    volumes:
      - ./starrocks/init.sh:/init.sh:ro
    depends_on:
      starrocks-fe:
        condition: service_healthy
      starrocks-be:
        condition: service_healthy

  cubestore:
    image: cubejs/cubestore:${CUBE_VERSION:-latest}
    profiles: [starrocks]
    restart: unless-stopped
    environment:
      CUBESTORE_SERVER_NAME: cubestore:9999
      CUBESTORE_META_PORT: "9999"
      CUBESTORE_WORKERS: cubestore-worker:10001
      CUBESTORE_REMOTE_DIR: /cube/data
    volumes:
      - cubestore_data:/cube/data

  cubestore-worker:
    image: cubejs/cubestore:${CUBE_VERSION:-latest}
    profiles: [starrocks]
    restart: unless-stopped
    depends_on:
      - cubestore
    environment:
      CUBESTORE_SERVER_NAME: cubestore-worker:10001
      CUBESTORE_WORKER_PORT: "10001"
      CUBESTORE_WORKERS: cubestore-worker:10001
      CUBESTORE_META_ADDR: cubestore:9999
      CUBESTORE_REMOTE_DIR: /cube/data
    volumes:
      - cubestore_data:/cube/data

  cube:
    image: cubejs/cube:${CUBE_VERSION:-latest}
    profiles: [starrocks]
    restart: unless-stopped
    depends_on:
      starrocks-init:
        condition: service_completed_successfully
      cubestore:
        condition: service_started
    ports:
      - "127.0.0.1:${CUBE_PORT:-4000}:4000"
    environment:
      # Production mode: no Playground, no stack traces in error bodies. The model and
      # cube.js (dialect fix, auth, row-level security) are in ./cube.
      CUBEJS_DEV_MODE: "false"
      CUBEJS_PRE_AGGREGATIONS_SCHEMA: ${CUBE_PREAGG_SCHEMA:-dev_pre_aggregations}
      CUBEJS_REFRESH_WORKER: "true"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}
      # StarRocks speaks the MySQL protocol. cube_ro can only SELECT on the mart.
      CUBEJS_DB_TYPE: mysql
      CUBEJS_DB_HOST: starrocks-fe
      CUBEJS_DB_PORT: "9030"
      CUBEJS_DB_NAME: mart
      CUBEJS_DB_USER: cube_ro
      CUBEJS_DB_PASS: ${CUBE_DB_PASSWORD:?set CUBE_DB_PASSWORD in .env}
      CUBEJS_CUBESTORE_HOST: cubestore
      # Several concurrent big scans overload StarRocks; whole-table rollups run for minutes.
      CUBEJS_CONCURRENCY: "${CUBE_CONCURRENCY:-6}"
      CUBEJS_DB_MAX_POOL: "${CUBE_CONCURRENCY:-6}"
      CUBEJS_DB_QUERY_TIMEOUT: "7200"
    volumes:
      - ./cube:/cube/conf
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    profiles: [starrocks]
    restart: unless-stopped
    # Dev mode (embedded H2, plain HTTP): fine for the demo, not for production.
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Tokens carry this issuer whichever URL they were fetched from, so the auth service can
      # validate them; the backchannel stays reachable as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?set TEST_USER_PASSWORD in .env}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:?set AGENT_CLIENT_SECRET in .env}
      # The dashboard's address, for the realm's redirect URIs (see realm-spike.json).
      DASHBOARD_CUBE_PORT: ${DASHBOARD_CUBE_PORT:-8250}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-spike.json:/opt/keycloak/data/import/realm-spike.json:ro
    healthcheck:
      # The image has no curl; probe the management port (9000) via bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  auth:
    build: ./auth
    profiles: [starrocks]
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_PORT:-8200}:8200"
    environment:
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}
      CUBE_JWT_TTL_SECONDS: ${CUBE_JWT_TTL_SECONDS:-900}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/spike
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/spike/protocol/openid-connect/certs
      ALLOWED_ORIGINS: http://localhost:${DASHBOARD_CUBE_PORT:-8250}
      STARROCKS_HOST: starrocks-fe
      AUTH_DB_USER: auth_ro
      AUTH_REGIONS_TABLE: rls.user_regions
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  actions:
    build: ./actions
    profiles: [starrocks]
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      postgres_active:
        condition: service_healthy
      starrocks-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ACTIONS_PORT:-8300}:8300"
    environment:
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/spike
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/spike/protocol/openid-connect/certs
      ALLOWED_ORIGINS: http://localhost:${DASHBOARD_CUBE_PORT:-8250}
      ACTIONS_PG_HOST: postgres_active
      ACTIONS_PG_PORT: "5434"
      ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:?set ACTIONS_DB_PASSWORD in .env}
      STARROCKS_HOST: starrocks-fe
      ACTIONS_SR_USER: actions_ro
      ACTIONS_SR_PASSWORD: ${ACTIONS_SR_PASSWORD:?set ACTIONS_SR_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8300/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  dashboard-cube:
    # The dashboard UI (dashboard/static), served as static files with the Cube data source
    # injected in front of app.js (Keycloak sign-in + Cube queries instead of SQL).
    image: nginx:1.27-alpine
    profiles: [starrocks]
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_CUBE_PORT:-8250}:8250"
    volumes:
      - ./dashboard/static:/usr/share/nginx/html:ro
      - ./dashboard/cube:/srv/cube:ro
      - ./dashboard/cube/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8180}
      AUTH_PORT: ${AUTH_PORT:-8200}
      CUBE_PORT: ${CUBE_PORT:-4000}
      ACTIONS_PORT: ${ACTIONS_PORT:-8300}
      # Optional second dataset in the dashboard: the port of the 250M benchmark Cube (spike/bench/run_scale.sh 250m).
      CUBE_250M_PORT: ${CUBE_250M_PORT:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8250/"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  postgres_active_data:
  kafka_data:
  clickhouse_data:
  starrocks_fe_meta:
  starrocks_be_storage:
  cubestore_data:
  keycloak_data:
