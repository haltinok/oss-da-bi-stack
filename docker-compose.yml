x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # dbt reads its connection from the environment (see dbt/.../profiles.yml),
    # so no credentials are stored in the repository.
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    DBT_PG_HOST: postgres
    DBT_PG_PORT: "5432"
    DBT_PG_USER: postgres
    DBT_PG_DATABASE: ${POSTGRES_DB:-analytics}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-changeme}
    # Airflow 3 defaults to the Simple Auth Manager; switching to FAB keeps
    # the familiar env-var-provisioned admin user/password workflow.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/scripts:/opt/airflow/scripts
    - ./dlt:/opt/airflow/dlt
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

# Every published port is overridable from .env so this stack can run next to
# another one on the same host (the defaults below are the historical values).
services:
  postgres:
    image: postgres:16
    container_name: oss_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_active:
    image: postgres:16
    container_name: postgres_active
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: active_db
    ports:
      - "${POSTGRES_ACTIVE_PORT:-5434}:5434"
    command:
      - "postgres"
      - "-p"
      - "5434"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_wal_size=4GB"
    volumes:
      - postgres_active_data:/var/lib/postgresql/data
      - ./postgres_active/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5434"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-perm-fix:
    <<: *airflow-common
    container_name: oss_airflow_perm_fix
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/plugins
        mkdir -p /opt/airflow/dbt/adventureworks_dwh/target /opt/airflow/dbt/adventureworks_dwh/logs
        chown -R 50000:0 /opt/airflow/dbt/adventureworks_dwh/target /opt/airflow/dbt/adventureworks_dwh/logs

  airflow-init:
    <<: *airflow-common
    container_name: oss_airflow_init
    entrypoint: /bin/bash
    depends_on:
      postgres:
        condition: service_healthy
      airflow-perm-fix:
        condition: service_completed_successfully
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true

  airflow-api-server:
    <<: *airflow-common
    container_name: oss_airflow_api_server
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: oss_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: oss_airflow_dag_processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: oss_airflow_triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset-init:
    build:
      context: ./superset
    container_name: oss_superset_init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme_superset_secret}
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/superset_meta
      PYTHONPATH: /app/pythonpath
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.local --password admin || true &&
      superset init
      "

  superset:
    build:
      context: ./superset
    container_name: oss_superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme_superset_secret}
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/superset_meta
      PYTHONPATH: /app/pythonpath
    ports:
      - "${SUPERSET_PORT:-8089}:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    depends_on:
      superset-init:
        condition: service_completed_successfully
    command: ["superset", "run", "-h", "0.0.0.0", "-p", "8088", "--with-threads"]

  superset-mcp:
    build:
      context: ./superset
    container_name: oss_superset_mcp
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme_superset_secret}
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/superset_meta
      PYTHONPATH: /app/pythonpath
      MCP_DEV_USERNAME: ${MCP_DEV_USERNAME:-admin}
    ports:
      - "${SUPERSET_MCP_PORT:-5008}:5008"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    depends_on:
      - superset
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]

  kafka:
    image: confluentinc/cp-kafka:8.0.7
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 20 -b kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-connect:
    build:
      context: ./debezium-connect
    container_name: kafka_connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_HEAP: -Xmx1g
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy

  # Creates or updates the Debezium connector once Connect's REST API is up, so
  # registering it is no longer a manual setup step. Uses the Debezium/Connect
  # image (which ships python3) and PUT, which is idempotent -- re-running
  # compose updates the connector in place instead of triggering another
  # initial snapshot.
  debezium-register:
    build:
      context: ./debezium-connect
    container_name: oss_debezium_register
    restart: "no"
    entrypoint: ["python3", "/connectors/register_connector.py"]
    volumes:
      - ./debezium-connect:/connectors:ro
    depends_on:
      postgres_active:
        condition: service_healthy
      kafka-connect:
        condition: service_started

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile: 262144
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -qi ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  postgres_active_data:
  kafka_data:
  clickhouse_data:
  superset_home:
