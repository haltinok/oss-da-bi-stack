# Serve the starrocks profile on the internet at PUBLIC_URL (e.g. https://demo.eloha-da.com): a Caddy front door gets the
# TLS certificate and routes by path, and Keycloak, the auth and actions services and the dashboard learn their public address.
# An overlay, so a local run (docker-compose.yml alone, PUBLIC_URL unset) is unchanged. Use it with
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.public.yml     (in .env, so plain `docker compose` commands pick it up)
#   PUBLIC_URL=https://demo.eloha-da.com
#
# Only Caddy publishes ports (80 and 443); every other service stays bound to 127.0.0.1 or unpublished. Steps: docs/deploy-demo.md.
services:
  caddy:
    image: caddy:${CADDY_VERSION:-2.8}-alpine
    profiles: [starrocks]
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env (e.g. https://demo.eloha-da.com)}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # the certificates: keep it, Let's Encrypt rate-limits re-issuing
      - caddy_config:/config
    depends_on:
      keycloak:
        condition: service_healthy
      auth:
        condition: service_healthy
      dashboard-cube:
        condition: service_healthy
      cube:
        condition: service_started
      actions:
        condition: service_started
      builder:
        condition: service_started

  keycloak:
    environment:
      # Served under /kc behind Caddy; tokens carry the public issuer; the proxy's X-Forwarded-* headers are trusted.
      KC_HTTP_RELATIVE_PATH: /kc
      KC_HOSTNAME: ${PUBLIC_URL:?set PUBLIC_URL}/kc
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      # The management interface (9000) moves under the relative path too: /kc/health/ready, not /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /kc/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]

  auth:
    environment:
      KEYCLOAK_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL}/kc/realms/spike
      KEYCLOAK_JWKS_URL: http://keycloak:8080/kc/realms/spike/protocol/openid-connect/certs

  actions:
    environment:
      KEYCLOAK_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL}/kc/realms/spike
      KEYCLOAK_JWKS_URL: http://keycloak:8080/kc/realms/spike/protocol/openid-connect/certs

  builder:
    environment:
      KEYCLOAK_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL}/kc/realms/spike
      KEYCLOAK_JWKS_URL: http://keycloak:8080/kc/realms/spike/protocol/openid-connect/certs

  dashboard-cube:
    environment:
      PATH_ROUTING: "1"

  # The weekly proposal agent signs in to Keycloak on the compose network, where the realm now lives under /kc.
  airflow-scheduler:
    environment:
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/kc/realms/spike/protocol/openid-connect/token

volumes:
  caddy_data:
  caddy_config:
