[destination.postgres.credentials]
host = "postgres"
port = 5432
database = "analytics"
username = "postgres"

# Non-secret connection settings. The passwords come from POSTGRES_PASSWORD in
# .env (applied by dlt/pipelines/stack_credentials.py); their sections live in
# secrets.toml because dlt 1.30 requires credentials to resolve from a secrets
# provider (see secrets.toml.example).
[sources.sql_database.credentials]
drivername = "postgresql+psycopg2"
host = "postgres_active"
port = 5434
database = "active_db"
username = "postgres"

# Sequential (single-worker) normalization avoids a process-pool race condition
# seen when loading many small tables (sporadic "No such file or directory" on typed-jsonl files).
[normalize]
workers = 1
