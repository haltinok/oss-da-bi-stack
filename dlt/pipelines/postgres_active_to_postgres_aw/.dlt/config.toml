# Warehouse connection (password: POSTGRES_PASSWORD, see stack_credentials.py).
# Deliberately NOT under `destination.postgres.credentials`: dlt >=1.x treats a
# `credentials` section in config.toml as a secret in a non-secret provider.
[stack.warehouse]
host = "postgres"
port = 5432
database = "analytics"
username = "postgres"

# postgres_active source connection (same password rules as above).
[stack.postgres_active]
drivername = "postgresql+psycopg2"
host = "postgres_active"
port = 5434
database = "active_db"
username = "postgres"

# Sequential (single-worker) normalization avoids a process-pool race condition
# seen when loading many small tables (sporadic "No such file or directory" on typed-jsonl files).
[normalize]
workers = 1
