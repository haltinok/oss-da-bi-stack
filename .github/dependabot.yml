# MUTED (2026-11-02): every ecosystem has open-pull-requests-limit: 0, so Dependabot opens no version-update PRs (the bumps kept breaking CI on
# transitive incompatibilities: mysql-connector-python vs dbt-starrocks, cp-kafka-connect vs Debezium). Security updates are separate: they still arrive
# through Dependabot alerts as soon as an advisory is published. To turn it back on, remove the `open-pull-requests-limit: 0` lines.
#
# (Original note:) Keeps the pinned versions current. Runs monthly (on the 1st) and groups
# updates, so each ecosystem opens at most one PR a month; CI must pass before
# merging. Security fixes don't wait for this schedule: they arrive through
# Dependabot alerts / security updates as soon as an advisory is published.
#
# NOTE: cp-kafka (in docker-compose.yml) and cp-kafka-connect (in
# debezium-connect/Dockerfile) are different ecosystems, so Dependabot can
# never put them in one PR. When their PRs arrive, merge them together -- the
# cdc-smoke CI job is the enforcement that Kafka and Connect still work as a
# pair.
version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0                          # muted: no version-update PRs (see the note at the top)
    groups:
      actions:
        patterns: ["*"]

  # Airflow image dependencies (dlt, faker, dbt-starrocks, ...). Versions must stay
  # compatible with the Airflow constraints for the base image.
  - package-ecosystem: pip
    directory: /airflow
    schedule:
      interval: monthly
    open-pull-requests-limit: 0                          # muted: no version-update PRs (see the note at the top)
    groups:
      python:
        patterns: ["*"]
    ignore:
      # dbt-core must track the dbt-starrocks adapter (the adapter lags core), so a
      # group bump can pair a newer core with an older adapter and break `dbt build`.
      # Upgrade the pair together, by hand (requirements-dbt-starrocks.txt and
      # dbt/adventureworks_starrocks/requirements.txt).
      - dependency-name: "dbt-core"

  # Base images of the custom builds. Major bumps (Airflow,
  # Confluent) usually need code changes, so they are left to a human.
  - package-ecosystem: docker
    directories:
      - /airflow
      - /debezium-connect
    schedule:
      interval: monthly
    open-pull-requests-limit: 0                          # muted: no version-update PRs (see the note at the top)
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # cp-kafka-connect 8.4 drops org.apache.kafka.common.utils.Sanitizer, which
      # the Debezium Postgres connector (3.2.x, the newest on Confluent Hub) still
      # calls: the task dies with NoClassDefFoundError (seen in cdc-smoke, #141).
      # Lift this once Confluent Hub ships a Debezium release built for Kafka 4.2.
      - dependency-name: "confluentinc/cp-kafka-connect"
        versions: [">= 8.4"]

  # Images referenced directly in docker-compose.yml (postgres, clickhouse,
  # kafka, kafka-ui, keycloak, cube, nginx, starrocks).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0                          # muted: no version-update PRs (see the note at the top)
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ClickHouse: stay on long-term-support releases. LTS lines are 24.8,
      # 25.3, 25.8, 26.3, ... and the minors in between (e.g. 25.12) are
      # non-LTS; the README notes the Kafka-engine tables depend on the bundled
      # Kafka client, so a non-LTS bump deserves a human. Patch bumps of the
      # current LTS still come through; bump to the next LTS (26.3) by hand.
      - dependency-name: "clickhouse/clickhouse-server"
        versions: [">= 25.9"]
