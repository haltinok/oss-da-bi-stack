# Keeps the pinned versions current. Updates are grouped so each ecosystem
# opens at most one PR a week; CI must pass before merging.
version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Airflow image dependencies (dlt, dbt, faker, ...). Versions must stay
  # compatible with the Airflow constraints for the base image.
  - package-ecosystem: pip
    directory: /airflow
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base images of the custom builds. Major bumps (Airflow, Superset,
  # Confluent) usually need code changes, so they are left to a human.
  - package-ecosystem: docker
    directories:
      - /airflow
      - /superset
      - /debezium-connect
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images referenced directly in docker-compose.yml (postgres, clickhouse,
  # kafka, metabase, kafka-ui).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
