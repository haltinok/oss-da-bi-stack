name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (the repository is public); the comment
# names the tag each SHA was resolved from.
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  # Every DAG imports cleanly under the Airflow version the image uses.
  dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install Airflow (version from airflow/Dockerfile)
        run: |
          version="$(sed -n 's|^FROM apache/airflow:\([0-9.]*\)-.*|\1|p' airflow/Dockerfile)"
          pip install "apache-airflow==${version}" apache-airflow-providers-standard pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${version}/constraints-3.11.txt"
      - name: DAG integrity
        run: |
          airflow db migrate
          pytest -q tests/test_dag_integrity.py

  # End to end on the orders batch path: seed the postgres_active sandbox from
  # the committed init files and replicate it into the warehouse with the dlt
  # orders pipeline. (The star schema is built by dbt-starrocks; its project is
  # checked by the dbt-starrocks job, and the StarRocks profile by compose/images.)
  dwh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      DEBEZIUM_PASSWORD: ci_dbz
      # dlt: env vars override the Compose hostnames in .dlt/config.toml
      # ([stack.warehouse] / [stack.postgres_active], see stack_credentials.py).
      STACK__WAREHOUSE__HOST: localhost
      STACK__POSTGRES_ACTIVE__HOST: localhost
      STACK__POSTGRES_ACTIVE__PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install dlt (versions from airflow/requirements.txt)
        run: |
          pip install $(grep -E '^(dlt|setuptools)' airflow/requirements.txt \
            | sed 's/^dlt\[postgres\]/dlt[postgres,sql_database]/')
      - name: initialise the warehouse and the postgres_active sandbox
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -f postgres/init/01_init.sql
          psql -v ON_ERROR_STOP=1 -d postgres -c "create database active_db"
          POSTGRES_DB=active_db bash postgres_active/init/00_debezium_user.sh
          for f in 01_init.sql 02_adventureworks_schema.sql; do
            psql -q -v ON_ERROR_STOP=1 -d active_db -f "postgres_active/init/$f"
          done
          gunzip -c postgres_active/init/03_adventureworks_seed.sql.gz \
            | psql -q -v ON_ERROR_STOP=1 -d active_db >/dev/null
          psql -v ON_ERROR_STOP=1 -d active_db -f postgres_active/init/04_debezium_signal.sql
      - name: dlt postgres_active -> raw.orders
        working-directory: dlt/pipelines/postgres_active_to_postgres
        run: python orders_pipeline.py

  # The StarRocks dbt project: parse it (no database needed) with and without the primary-key
  # snapshot sources, which are only enabled when the pipeline loads them.
  dbt-starrocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install dbt-starrocks (versions from the project's requirements.txt)
        run: pip install -r dbt/adventureworks_starrocks/requirements.txt
      - name: dbt parse
        working-directory: dbt/adventureworks_starrocks
        run: |
          dbt parse --profiles-dir . --vars '{use_pk_snapshots: false}'
          dbt parse --profiles-dir . --vars '{use_pk_snapshots: true}'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate compose (every profile)
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile cdc config >/dev/null
          docker compose --profile starrocks config >/dev/null
          docker compose --profile cdc --profile starrocks config >/dev/null
          # the public (HTTPS front door) overlay needs PUBLIC_URL
          export PUBLIC_URL=https://demo.example.test
          docker compose -f docker-compose.yml -f docker-compose.public.yml --profile starrocks config >/dev/null
          # DATASET=both adds the second Cube (profile dual)
          DATASET=both docker compose -f docker-compose.yml -f docker-compose.public.yml --profile starrocks --profile dual config | grep -q 'cube-250m:'
      - name: the dashboard's browser config (local / public, live / 250m)
        run: scripts/check-config-js.sh
      - name: Cube's 250m model loader
        run: |
          docker run --rm --entrypoint node -e NODE_PATH=/cube/node_modules -v "$PWD:/work:ro" -w /work \
            cubejs/cube:latest cube/tests/dataset.test.js
      - name: validate the Caddyfile
        run: |
          docker run --rm -e PUBLIC_URL=https://demo.example.test -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

  # Builds the custom images. The dags/dwh jobs install Python packages
  # directly on the runner, so without this job a Dockerfile break (or a
  # requirements change that breaks the image build) can pass CI. Building is
  # also the only real test of the base-image bumps Dependabot proposes for
  # the airflow and debezium-connect Dockerfiles.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fill .env (values don't matter, only that they're set)
        run: cp .env.example .env
      - name: build the images
        run: docker compose --profile starrocks build airflow-scheduler kafka-connect auth actions
      - name: check the airflow image's Python environment
        run: |
          docker run --rm --entrypoint /bin/bash oss-da-bi-stack-airflow-scheduler:latest -ec '
            pip check
            python -c "import dlt; print(\"dlt\", dlt.__version__)"
            # pip show exits 1 when the package is missing.
            pip show apache-airflow-providers-fab >/dev/null
            echo "airflow image checks passed"
          '
      - name: check ingestr and the dbt-starrocks environment in the airflow image
        # The StarRocks pipeline runs ingestr (a pinned binary copied from its image) and dbt-starrocks
        # from its own virtualenv; the main environment's pip check above does not cover either.
        run: |
          docker run --rm --entrypoint /bin/bash oss-da-bi-stack-airflow-scheduler:latest -ec '
            ingestr --version
            /home/airflow/dbt-starrocks/bin/pip check
            /home/airflow/dbt-starrocks/bin/dbt --version
            # the weekly proposal agent: its own environment
            /home/airflow/agent/bin/pip check
            /home/airflow/agent/bin/python -c "import anthropic, requests; print(\"anthropic\", anthropic.__version__)"
            echo "ingestr + dbt-starrocks + agent checks passed"
          '

  # End to end on the CDC path, which nothing else in CI touches: bring up the
  # cdc profile from the compose file, wait for the connector's initial
  # snapshot, insert one row into postgres_active.orders and check it lands in
  # clickhouse's cdc.orders. This is the test run by hand for every connector,
  # broker or ClickHouse change -- including Dependabot's cp-kafka (#7),
  # cp-kafka-connect (#3) and ClickHouse (#5) bumps.
  cdc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fill .env
        run: cp .env.example .env
      - name: build the connect image
        run: docker compose build kafka-connect
      - name: start the cdc path
        # On failure (e.g. a container never turns healthy), show why: the
        # health status and the tail of each service's log.
        run: |
          if ! docker compose --profile cdc up -d postgres_active kafka kafka-connect debezium-register clickhouse; then
            for c in kafka_connect kafka postgres_active clickhouse; do
              echo "::group::$c" >&2
              docker inspect --format '{{json .State.Health}}' "$c" >&2 || true
              docker logs "$c" 2>&1 | tail -80 >&2 || true
              echo "::endgroup::" >&2
            done
            exit 1
          fi
      - name: wait for the connector and its task to reach RUNNING
        run: |
          set -euo pipefail
          # The connector can report RUNNING while its task has FAILED (bad
          # password, missing slot), so require every task to be RUNNING too.
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8083/connectors/orders-connector/status > /tmp/connector.json \
              && jq -e '.connector.state == "RUNNING" and (.tasks | length > 0) and all(.tasks[]; .state == "RUNNING")' \
                   /tmp/connector.json >/dev/null; then
              echo "connector and task RUNNING (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "connector or task never reached RUNNING" >&2
          cat /tmp/connector.json >&2 || true
          docker logs kafka_connect | tail -40 >&2
          docker logs oss_debezium_register | tail -20 >&2
          exit 1
      - name: insert one row and wait for it in clickhouse
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker exec postgres_active psql -U postgres -p 5434 -d active_db \
            -c "insert into public.orders (customer_name, amount, status) values ('ci-smoke', 12.34, 'created');"
          for i in $(seq 1 60); do
            n="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select count() from cdc.orders where customer_name = 'ci-smoke'" 2>/dev/null || echo 0)"
            if [ "$n" -ge 1 ]; then
              echo "row arrived in cdc.orders (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "row never reached cdc.orders" >&2
          docker logs kafka_connect | tail -40 >&2
          docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
            -q "select count() from cdc.orders" >&2 || true
          exit 1
      - name: update one product and wait for it in cdc.aw_events
        # The AdventureWorks tables share one multi-topic Kafka-engine table;
        # this covers that path (an update, so op = 'u') the same way. First
        # wait until ClickHouse is consuming all nine AW topics: Debezium only
        # creates them during its snapshot, and cdc.aw_kafka picks up a topic
        # on its next metadata refresh (10 s, clickhouse/config.d/kafka.xml).
        # Every seeded AW table has rows, so each topic shows up in aw_events.
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          for i in $(seq 1 60); do
            topics="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select uniqExact(source_table) from cdc.aw_events" 2>/dev/null || echo 0)"
            if [ "$topics" -ge 9 ]; then
              echo "all 9 AdventureWorks topics consumed (poll $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "only $topics of 9 AdventureWorks topics reached cdc.aw_events" >&2
              docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
                -q "select source_table, op, count() from cdc.aw_events group by 1, 2" >&2 || true
              exit 1
            fi
            sleep 3
          done
          docker exec postgres_active psql -U postgres -p 5434 -d active_db -c \
            "update public.product set modified_date = now()
             where product_id = (select min(product_id) from public.product);"
          for i in $(seq 1 60); do
            n="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select count() from cdc.aw_events where source_table = 'active_db.public.product' and op = 'u'" 2>/dev/null || echo 0)"
            if [ "$n" -ge 1 ]; then
              echo "product update arrived in cdc.aw_events (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "product update never reached cdc.aw_events" >&2
          docker logs kafka_connect | tail -40 >&2
          docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
            -q "select source_table, op, count() from cdc.aw_events group by 1, 2" >&2 || true
          exit 1

  # Boots the StarRocks serving path for real: the source database, StarRocks, the pipeline (ingestr then
  # dbt, run twice so the second build exercises the incremental facts), then Cube, Keycloak and the auth
  # service, and the row-level-security tests against them. Demo data only.
  starrocks-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The hosted runner has 16 GB; leave room for Cube, Keycloak and the rest.
      STARROCKS_MEM_LIMIT: 7g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generate .env (random secrets)
        run: ./scripts/generate-env.sh
      - name: build the images
        run: docker compose --profile starrocks build airflow-scheduler auth actions
      - name: start the source and StarRocks
        run: |
          docker compose --profile starrocks up -d postgres_active starrocks-fe starrocks-be
          docker compose --profile starrocks up --no-deps --exit-code-from starrocks-init starrocks-init
          docker compose --profile starrocks run --rm --no-deps airflow-perm-fix
      - name: pipeline, full build then incremental build
        # The same two commands as the postgres_active_to_starrocks DAG.
        run: |
          cycle() {
            # dbt (Python with the MySQL connector) has segfaulted about once in a dozen runs, always at start-up
            # of an invocation and before any model ran (exit 139). PYTHONFAULTHANDLER prints the Python stack when
            # it happens; the run is retried once on that exit code only, so a real failure still fails the job.
            for attempt in 1 2; do
              rc=0
              docker compose --profile starrocks run --rm --no-deps -e PYTHONFAULTHANDLER=1 --entrypoint bash airflow-scheduler -ec '
                python /opt/airflow/scripts/ingest_starrocks.py
                cd /opt/airflow/dbt/adventureworks_starrocks
                /home/airflow/dbt-starrocks/bin/dbt build --profiles-dir . \
                  --vars "{aw_source_schema: raw, use_pk_snapshots: true}" --threads 4
              ' || rc=$?
              [ "$rc" -eq 139 ] && [ "$attempt" -eq 1 ] && { echo "::warning::dbt segfaulted (139), retrying once"; continue; }
              return "$rc"
            done
          }
          cycle
          cycle
      - name: start Cube, Keycloak and the auth service
        run: |
          docker compose --profile starrocks up -d --wait --wait-timeout 600 cubestore cubestore-worker cube keycloak auth actions dashboard-cube
      - name: row-level security tests
        run: |
          set -a; . ./.env; set +a
          pip install pytest requests pymysql pyjwt cryptography psycopg2-binary
          python -m pytest cube/tests -q
          # the dataset-handling unit tests need fastapi and run in the actions-rules job
          python -m pytest actions/tests -q --ignore=actions/tests/test_actions_dataset.py
      - name: logs on failure
        if: failure()
        run: |
          for c in $(docker compose --profile starrocks ps -a --format '{{.Name}}'); do
            echo "::group::$c"; docker logs --tail 60 "$c" 2>&1 || true; echo "::endgroup::"
          done

  # The actions service's validation rules and read-only mode, the auth service's dataset handling and the proposal agent
  # (against a scripted stand-in for the model) need no services.
  actions-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest requests fastapi httpx 'pyjwt[crypto]' pymysql psycopg2-binary pydantic
      - run: python -m pytest actions/tests/test_rules.py actions/tests/test_actions_dataset.py auth/tests agent/tests -q

  # Dashboard specs (dashboards/*.yml): the validator's tests, every checked-in spec validated against the Cube model, and the compiler.
  dashspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml 'jsonschema>=4.18'
      - env:
          PYTHONPATH: dashboards
        run: |
          python -m pytest dashboards/tests -q
          python -m dashspec validate dashboards/*.yml
          for f in dashboards/*.yml; do python -m dashspec compile "$f" -o "/tmp/dashspec-build/$(basename "${f%.yml}").json"; done

  # The public overlay (docker-compose.public.yml): Keycloak under /kc, the auth service and the dashboard behind Caddy at one
  # address. Plain HTTP on a local port stands in for the HTTPS front door; the routing, issuer, admin-console block and browser
  # config are the same. (The certificate itself needs a real domain and ports 80/443: see docs/deploy-demo.md.)
  public-routing:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: http://localhost:8088
      COMPOSE_FILE: docker-compose.yml:docker-compose.public.yml:ci-public.yml
      CADDY_HTTP_PORT: "8080"
      CADDY_HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generate .env and publish Caddy on a test port
        run: |
          ./scripts/generate-env.sh
          printf 'services:\n  caddy:\n    ports:\n      - "127.0.0.1:8088:8088"\n' > ci-public.yml
      - name: start Keycloak, the auth service, the dashboard and Caddy
        run: |
          docker compose --profile starrocks build auth
          docker compose --profile starrocks up -d --no-deps keycloak
          for i in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --profile starrocks ps -q keycloak)")" = healthy ] && break; sleep 3; done
          docker compose --profile starrocks up -d --no-deps auth dashboard-cube caddy
          for i in $(seq 40); do curl -sf http://localhost:8088/auth-api/healthz >/dev/null && break; sleep 3; done
      - name: routing, issuer, admin console block, browser config
        run: |
          set -euo pipefail
          B=http://localhost:8088
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $B/)" = 200
          curl -s $B/cube/config.js | grep -q 'keycloak: { url: "http://localhost:8088/kc"'
          issuer=$(curl -s $B/kc/realms/spike/.well-known/openid-configuration | jq -r .issuer)
          test "$issuer" = "$B/kc/realms/spike"
          for p in /kc/admin/ /kc/realms/master /kc/realms/master/.well-known/openid-configuration; do test "$(code $B$p)" = 404; done
          test "$(code -X POST $B/auth-api/token -H 'Authorization: Bearer x.y.z')" = 401
          test "$(code $B/cubejs-api/v1/meta)" != 200      # no Cube is running here: 502 from Caddy, never an unauthenticated 200
          set -a; . ./.env; set +a
          iss=$(curl -s -X POST $B/kc/realms/spike/protocol/openid-connect/token -d grant_type=password -d client_id=dashboard \
                  -d username=admin -d "password=$TEST_USER_PASSWORD" | jq -r .access_token \
                | python3 -c "import sys,base64,json;s=sys.stdin.read().split('.')[1];print(json.loads(base64.urlsafe_b64decode(s+'='*(-len(s)%4)))['iss'])")
          test "$iss" = "$B/kc/realms/spike"
          echo "public routing checks passed"
      - name: logs on failure
        if: failure()
        run: |
          for c in $(docker compose --profile starrocks ps -a --format '{{.Name}}'); do echo "::group::$c"; docker logs --tail 40 "$c" 2>&1 || true; echo "::endgroup::"; done
