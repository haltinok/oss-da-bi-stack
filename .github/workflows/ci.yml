name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (the repository is public); the comment
# names the tag each SHA was resolved from.
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  # Every DAG imports cleanly under the Airflow version the image uses.
  dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install Airflow (version from airflow/Dockerfile)
        run: |
          version="$(sed -n 's|^FROM apache/airflow:\([0-9.]*\)-.*|\1|p' airflow/Dockerfile)"
          pip install "apache-airflow==${version}" apache-airflow-providers-standard pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${version}/constraints-3.11.txt"
      - name: DAG integrity
        run: |
          airflow db migrate
          pytest -q tests/test_dag_integrity.py

  # End to end on the batch path: seed the postgres_active sandbox from the
  # committed init files, replicate it with the dlt pipeline, then `dbt build`
  # (models + snapshot + all data tests) on the result.
  dwh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      BI_READONLY_PASSWORD: ci_ro
      DEBEZIUM_PASSWORD: ci_dbz
      # dlt: env vars override the Compose hostnames in .dlt/config.toml
      # ([stack.warehouse] / [stack.postgres_active], see stack_credentials.py).
      STACK__WAREHOUSE__HOST: localhost
      STACK__POSTGRES_ACTIVE__HOST: localhost
      STACK__POSTGRES_ACTIVE__PORT: "5432"
      DBT_PG_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install dlt + dbt (versions from airflow/requirements.txt)
        run: |
          pip install $(grep -E '^(dlt|setuptools|dbt-core|dbt-postgres)' airflow/requirements.txt \
            | sed 's/^dlt\[postgres\]/dlt[postgres,sql_database]/')
      - name: initialise the warehouse and the postgres_active sandbox
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -f postgres/init/01_init.sql
          bash postgres/init/02_bi_readonly.sh
          psql -v ON_ERROR_STOP=1 -d postgres -c "create database active_db"
          POSTGRES_DB=active_db bash postgres_active/init/00_debezium_user.sh
          for f in 01_init.sql 02_adventureworks_schema.sql; do
            psql -q -v ON_ERROR_STOP=1 -d active_db -f "postgres_active/init/$f"
          done
          gunzip -c postgres_active/init/03_adventureworks_seed.sql.gz \
            | psql -q -v ON_ERROR_STOP=1 -d active_db >/dev/null
          psql -v ON_ERROR_STOP=1 -d active_db -f postgres_active/init/04_debezium_signal.sql
      - name: dlt postgres_active -> raw_active
        working-directory: dlt/pipelines/postgres_active_to_postgres_aw
        run: python aw_pipeline.py
      - name: dlt postgres_active -> raw.orders
        working-directory: dlt/pipelines/postgres_active_to_postgres
        run: python orders_pipeline.py
      - name: dbt build
        run: dbt build --project-dir dbt/adventureworks_dwh --profiles-dir dbt/adventureworks_dwh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate compose (every profile)
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile cdc config >/dev/null
          docker compose --profile bi config >/dev/null
          docker compose --profile cdc --profile bi config >/dev/null

  # Builds the three custom images. The dags/dwh jobs install Python packages
  # directly on the runner, so without this job a Dockerfile break (or a
  # requirements change that breaks the image build) can pass CI. Building is
  # also the only real test of the base-image bumps Dependabot proposes for
  # the airflow, superset and debezium-connect Dockerfiles.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fill .env (values don't matter, only that they're set)
        run: cp .env.example .env
      - name: build the images
        run: docker compose build airflow-scheduler superset kafka-connect
      - name: check the airflow image's Python environment
        run: |
          docker run --rm --entrypoint /bin/bash oss-da-bi-stack-airflow-scheduler:latest -ec '
            pip check
            python -c "import dlt, dbt; print(\"dlt\", dlt.__version__)"
            # pip show exits 1 when the package is missing.
            pip show apache-airflow-providers-fab >/dev/null
            echo "airflow image checks passed"
          '
      - name: check the superset image's drivers
        # The build only proves the pinned drivers installed; this proves they
        # import in Superset's venv.
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python oss-da-bi-stack-superset:latest \
            -c "import psycopg2, clickhouse_connect, fastmcp; print('superset drivers import')"

  # End to end on the CDC path, which nothing else in CI touches: bring up the
  # cdc profile from the compose file, wait for the connector's initial
  # snapshot, insert one row into postgres_active.orders and check it lands in
  # clickhouse's cdc.orders. This is the test run by hand for every connector,
  # broker or ClickHouse change -- including Dependabot's cp-kafka (#7),
  # cp-kafka-connect (#3) and ClickHouse (#5) bumps.
  cdc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fill .env
        run: cp .env.example .env
      - name: build the connect image
        run: docker compose build kafka-connect
      - name: start the cdc path
        # On failure (e.g. a container never turns healthy), show why: the
        # health status and the tail of each service's log.
        run: |
          if ! docker compose --profile cdc up -d postgres_active kafka kafka-connect debezium-register clickhouse; then
            for c in kafka_connect kafka postgres_active clickhouse; do
              echo "::group::$c" >&2
              docker inspect --format '{{json .State.Health}}' "$c" >&2 || true
              docker logs "$c" 2>&1 | tail -80 >&2 || true
              echo "::endgroup::" >&2
            done
            exit 1
          fi
      - name: wait for the connector and its task to reach RUNNING
        run: |
          set -euo pipefail
          # The connector can report RUNNING while its task has FAILED (bad
          # password, missing slot), so require every task to be RUNNING too.
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8083/connectors/orders-connector/status > /tmp/connector.json \
              && jq -e '.connector.state == "RUNNING" and (.tasks | length > 0) and all(.tasks[]; .state == "RUNNING")' \
                   /tmp/connector.json >/dev/null; then
              echo "connector and task RUNNING (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "connector or task never reached RUNNING" >&2
          cat /tmp/connector.json >&2 || true
          docker logs kafka_connect | tail -40 >&2
          docker logs oss_debezium_register | tail -20 >&2
          exit 1
      - name: insert one row and wait for it in clickhouse
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker exec postgres_active psql -U postgres -p 5434 -d active_db \
            -c "insert into public.orders (customer_name, amount, status) values ('ci-smoke', 12.34, 'created');"
          for i in $(seq 1 60); do
            n="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select count() from cdc.orders where customer_name = 'ci-smoke'" 2>/dev/null || echo 0)"
            if [ "$n" -ge 1 ]; then
              echo "row arrived in cdc.orders (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "row never reached cdc.orders" >&2
          docker logs kafka_connect | tail -40 >&2
          docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
            -q "select count() from cdc.orders" >&2 || true
          exit 1
      - name: update one product and wait for it in cdc.aw_events
        # The AdventureWorks tables share one multi-topic Kafka-engine table;
        # this covers that path (an update, so op = 'u') the same way. First
        # wait until ClickHouse is consuming all nine AW topics: Debezium only
        # creates them during its snapshot, and cdc.aw_kafka picks up a topic
        # on its next metadata refresh (10 s, clickhouse/config.d/kafka.xml).
        # Every seeded AW table has rows, so each topic shows up in aw_events.
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          for i in $(seq 1 60); do
            topics="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select uniqExact(source_table) from cdc.aw_events" 2>/dev/null || echo 0)"
            if [ "$topics" -ge 9 ]; then
              echo "all 9 AdventureWorks topics consumed (poll $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "only $topics of 9 AdventureWorks topics reached cdc.aw_events" >&2
              docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
                -q "select source_table, op, count() from cdc.aw_events group by 1, 2" >&2 || true
              exit 1
            fi
            sleep 3
          done
          docker exec postgres_active psql -U postgres -p 5434 -d active_db -c \
            "update public.product set modified_date = now()
             where product_id = (select min(product_id) from public.product);"
          for i in $(seq 1 60); do
            n="$(docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
              -q "select count() from cdc.aw_events where source_table = 'active_db.public.product' and op = 'u'" 2>/dev/null || echo 0)"
            if [ "$n" -ge 1 ]; then
              echo "product update arrived in cdc.aw_events (poll $i)"
              exit 0
            fi
            sleep 2
          done
          echo "product update never reached cdc.aw_events" >&2
          docker logs kafka_connect | tail -40 >&2
          docker exec clickhouse clickhouse-client --password "$CLICKHOUSE_PASSWORD" \
            -q "select source_table, op, count() from cdc.aw_events group by 1, 2" >&2 || true
          exit 1
