cubes:
  - name: calendar
    description: "Takvim: zaman ekseni ve yıllar için birleşme noktası; Türkçe ay ve gün adları, resmî tatil ve bayram günleri. (The calendar: join target for a time axis.)"
    sql_table: dist.dim_calendar
    data_source: default

    dimensions:
      - name: key
        description: "Date key (YYYYMMDD)."
        sql: date_key
        type: number
        primary_key: true
      - name: full_date
        description: "Calendar date (a time dimension)."
        sql: full_date
        type: time
      - name: calendar_year
        description: "Calendar year."
        sql: calendar_year
        type: number
      - name: calendar_quarter
        description: "Calendar quarter number, 1 to 4."
        sql: calendar_quarter
        type: number
      - name: month_of_year
        description: "Month number, 1 (January) to 12 (December)."
        sql: month_of_year
        type: number
      - name: month_name
        description: "Month name in Turkish (Ocak ... Aralık)."
        sql: month_name
        type: string
        meta:
          sort_by: month_of_year
      - name: year_month_number
        description: "Year and month as a number that sorts in time order: 202403 is March 2024."
        sql: year_month_number
        type: number
      - name: year_month
        description: "Month and year as text, e.g. Mart 2024."
        sql: "month_name || ' ' || calendar_year::text"
        type: string
        meta:
          sort_by: year_month_number
      - name: week_of_year
        description: "ISO week number."
        sql: week_of_year
        type: number
      - name: day_of_week
        description: "Day of the week, 1 (Monday) to 7 (Sunday)."
        sql: day_of_week
        type: number
      - name: weekday_name
        description: "Weekday name in Turkish."
        sql: weekday_name
        type: string
        meta:
          sort_by: day_of_week
      - name: holiday_name
        description: "The public holiday or bayram of the day (empty on other days)."
        sql: holiday_name
        type: string

  # The same calendar in another role: the day an invoice falls due.
  - name: maturity_dates
    extends: calendar
    description: "The calendar in the role of an invoice's due date (vade)."
    meta:
      label_prefix: Due
