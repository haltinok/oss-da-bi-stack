spec: 1
model: distributor
id: distributor-overview
title: Satış özeti
description: Ciro, marj, sipariş ve tahsilat; yıl, bölge ve bayi tipine göre.
tags: [dağıtım]
locale: tr-TR
currency: TRY
time:
  dimension: calendar.full_date
filters:
  - id: year
    dimension: calendar.calendar_year
    label: Yıl
  - id: region
    dimension: dealers.region
    label: Bölge
  - id: segment
    dimension: dealers.segment
    label: Bayi tipi
panels:
  - id: kpis
    type: kpi
    compare: previous_year
    measures:
      - { member: orders.revenue, label: Ciro, format: money }
      - { member: orders.gross_margin, label: Brüt kâr, format: money }
      - { member: orders.order_count, label: Sipariş, format: int }
      - { member: payments.collected, label: Tahsilat, format: money }
    sparkline: { granularity: month }
  - id: trend
    type: timeseries
    title: Aylık ciro ve tahsilat
    series:
      - { member: orders.revenue, label: Ciro, color: focus, format: money }
      - { member: payments.collected, label: Tahsilat, color: good, format: money }
    granularity: month
    style: line
  - id: segments
    type: pie
    title: Bayi tipine göre ciro
    measure: orders.revenue
    by: dealers.segment
    on_click: { set_filter: segment }
  - id: regions
    type: bar
    title: Bölgeye göre ciro
    by: dealers.region
    measure: orders.revenue
    sort: desc
    format: money
    on_click: { set_filter: region }
  - id: categories
    type: bar
    title: Kategoriye göre ciro
    by: items.category
    measure: orders.revenue
    sort: desc
    format: money
layout:
  - [{ kpis: 12 }]
  - [{ trend: 8 }, { segments: 4 }]
  - [{ regions: 6 }, { categories: 6 }]
