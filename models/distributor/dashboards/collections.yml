spec: 1
id: collections
title: Tahsilat takibi
description: Money collected by method and by dealer, and when it fell due.
tags: [dağıtım, tahsilat]
locale: tr-TR
currency: TRY
time:
  dimension: calendar.full_date
filters:
  - id: year
    dimension: calendar.calendar_year
    label: Yıl
panels:
  - id: kpis
    type: kpi
    measures:
      - { member: payments.collected, label: Tahsilat, format: money }
      - { member: payments.payment_count, label: Ödeme, format: int }
  - id: by_month
    type: timeseries
    title: Aylık tahsilat
    series:
      - { member: payments.collected, label: Tahsilat, color: good, format: money }
    granularity: month
    style: bar
  - id: by_method
    type: pie
    title: Ödeme yöntemi
    measure: payments.collected
    by: payments.method
  - id: by_dealer
    type: bar
    title: Bayiye göre tahsilat
    by: dealers.name
    measure: payments.collected
    sort: desc
    limit: 10
    format: money
layout:
  - [{ kpis: 12 }]
  - [{ by_month: 8 }, { by_method: 4 }]
  - [{ by_dealer: 12 }]
