# What the app needs to know about this model beyond Cube's /v1/meta (see PLAN-decouple.md; read by the app from phase 2 on).
time:
  dimension: calendar.full_date
  year_fields: { calendar: calendar.calendar_year }        # no fiscal year: a comparison with the previous year moves the calendar year
locale: tr-TR
currency: TRY
vocabulary:                       # what the rule-based stand-in understands beyond the members' own names (words without accents)
  words:
    ciro: orders.revenue
    siparis: orders.order_count
    adet: orders.quantity
    tahsilat: payments.collected
    odeme: payments.payment_count
    bolge: dealers.region
    sehir: dealers.city
    segment: dealers.segment
    bayi: dealers.name
    kategori: items.category
    urun: items.name
    marka: items.brand
  labels:                         # the names a Turkish page shows
    orders.revenue: Ciro
    orders.order_count: Sipariş
    orders.quantity: Adet
    payments.collected: Tahsilat
    payments.payment_count: Ödeme
    dealers.region: Bölge
    dealers.name: Bayi
    items.category: Kategori
    items.name: Ürün
